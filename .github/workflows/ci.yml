name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, integration/nfc-hardware-validation]
  workflow_dispatch:

jobs:
  flutter-ci:
    name: Flutter CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Verify Drift schema snapshot
        shell: bash
        run: |
          dart run drift_dev schema dump lib/db/app_database.dart drift_schemas/

          if [ -n "$(git status --porcelain -- drift_schemas)" ]; then
            echo "Drift schema snapshot is out of date."
            echo "Run:"
            echo "  dart run drift_dev schema dump lib/db/app_database.dart drift_schemas/"
            echo "and commit the resulting schema file."
            git status --short -- drift_schemas
            exit 1
          fi

      - name: Debug build verification
        run: flutter build apk --debug

      - name: Android NFC intent policy tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --tests '*Nfc*Test'

      - name: Create disposable CI upload key
        shell: bash
        run: |
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keystore="$RUNNER_TEMP/groovefolio-ci-upload.jks"
          keytool -genkeypair -noprompt -keystore "$keystore" \
            -alias ci-upload -keyalg RSA -keysize 3072 -validity 1 \
            -dname "CN=Groovefolio CI" -storepass "$password" \
            -keypass "$password" >/dev/null 2>&1
          {
            echo "GROOVEFOLIO_UPLOAD_KEYSTORE=$keystore"
            echo "GROOVEFOLIO_UPLOAD_KEY_ALIAS=ci-upload"
            echo "GROOVEFOLIO_UPLOAD_STORE_PASSWORD=$password"
            echo "GROOVEFOLIO_UPLOAD_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Release build verification (not published)
        run: flutter build apk --release
        # The disposable CI key is not the developer's Play upload key.
        # The APK and key are discarded with the runner; neither is uploaded.
