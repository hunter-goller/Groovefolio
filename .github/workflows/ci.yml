name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter-ci:
    name: Flutter CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Verify Drift schema snapshot
        shell: bash
        run: |
          dart run drift_dev schema dump lib/db/app_database.dart drift_schemas/

          if [ -n "$(git status --porcelain -- drift_schemas)" ]; then
            echo "Drift schema snapshot is out of date."
            echo "Run:"
            echo "  dart run drift_dev schema dump lib/db/app_database.dart drift_schemas/"
            echo "and commit the resulting schema file."
            git status --short -- drift_schemas
            exit 1
          fi

      - name: Build verification
        run: flutter build apk --debug
