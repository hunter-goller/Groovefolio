name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, integration/nfc-hardware-validation]
  workflow_dispatch:
  # Lets the release workflow run this exact pipeline, with the full builds,
  # for a version tag.
  workflow_call:

jobs:
  flutter-ci:
    name: Flutter CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned so CI matches pubspec.lock. A floating "stable" channel
          # silently changes Flutter-pinned packages and can break resolution.
          # Upgrade Flutter deliberately in its own PR, together with the lock.
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate code
        run: dart run build_runner build

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Verify Drift schema snapshot
        shell: bash
        run: |
          dart run drift_dev schema dump lib/db/app_database.dart drift_schemas/

          if [ -n "$(git status --porcelain -- drift_schemas)" ]; then
            echo "Drift schema snapshot is out of date."
            echo "Run:"
            echo "  dart run drift_dev schema dump lib/db/app_database.dart drift_schemas/"
            echo "and commit the resulting schema file."
            git status --short -- drift_schemas
            exit 1
          fi

      - name: Prepare Android build files
        # Writes local.properties and the plugin list Gradle needs, without
        # building the app, so the Kotlin tests below also run on PRs.
        run: flutter build apk --debug --config-only

      - name: Android NFC intent policy tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --tests '*Nfc*Test'

      # The app builds below take about 8 of CI's 11 minutes. PRs skip them;
      # every merge to main (and a manual run) still builds both, so a
      # release-only break shows up right after merging, not on release day.
      - name: Debug build verification
        if: github.event_name != 'pull_request'
        run: flutter build apk --debug

      - name: Create disposable CI upload key
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keystore="$RUNNER_TEMP/groovefolio-ci-upload.jks"
          keytool -genkeypair -noprompt -keystore "$keystore" \
            -alias ci-upload -keyalg RSA -keysize 3072 -validity 1 \
            -dname "CN=Groovefolio CI" -storepass "$password" \
            -keypass "$password" >/dev/null 2>&1
          {
            echo "GROOVEFOLIO_UPLOAD_KEYSTORE=$keystore"
            echo "GROOVEFOLIO_UPLOAD_KEY_ALIAS=ci-upload"
            echo "GROOVEFOLIO_UPLOAD_STORE_PASSWORD=$password"
            echo "GROOVEFOLIO_UPLOAD_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Release App Bundle verification (not published)
        if: github.event_name != 'pull_request'
        run: flutter build appbundle --release
        # Google Play only accepts App Bundles (AAB). The disposable CI key
        # is not the developer's Play upload key; the AAB and key are
        # discarded with the runner and nothing is uploaded.

      - name: Check the App Bundle is signed with the upload key
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          test -s "$aab" || { echo "Missing $aab"; exit 1; }
          # Release builds must use the upload key, never the debug key.
          js="$(command -v jarsigner || echo "$JAVA_HOME/bin/jarsigner")"
          "$js" -verify -verbose -certs "$aab" > "$RUNNER_TEMP/verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/verify.txt"
          grep -q "CN=Groovefolio CI" "$RUNNER_TEMP/verify.txt" || {
            echo "AAB is not signed with the provided upload key."
            exit 1
          }
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/verify.txt"; then
            echo "AAB is signed with the debug key."
            exit 1
          fi
          echo "Signed AAB: $(du -h "$aab" | cut -f1)"
