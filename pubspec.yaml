name: vinyl_app
description: "A local-first vinyl collection and listening tracker."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  drift: 2.34.0
  sqlite3_flutter_libs: ^0.6.0+eol

  path: ^1.9.1
  path_provider: ^2.1.6
  image_picker: ^1.1.2
  uuid: ^4.6.0
  crypto: ^3.0.7
  flutter_secure_storage: 10.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.4
  build_runner: ^2.15.1
  drift_dev: 2.34.0

flutter:
  uses-material-design: true
